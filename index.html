<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清的法语小课堂 — Le français avec Qing · V9</title>
<style>
:root{
  --creme:#FBF7EF; --creme2:#F3ECDD; --nuit:#1F2A44; --nuit2:#2A3855;
  --corail:#E8907A; --corail-d:#C96A52; --ok:#4C8A5C; --bad:#B4573F;
  --txt:#2B2B2B; --muted:#6B6355; --line:#E4DAC8;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{font-size:18px;}
body{margin:0;background:var(--creme);color:var(--txt);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  line-height:1.75; padding-bottom:calc(100px + env(safe-area-inset-bottom, 0px));}
.wrap{max-width:760px;margin:0 auto;padding:0 16px;}
header{background:var(--nuit);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:20;}
.hrow{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;justify-content:space-between;}
.logo{font-size:1.05rem;font-weight:700;letter-spacing:.5px;cursor:pointer;background:none;border:none;color:#fff;padding:8px 0;}
.logo small{display:block;font-size:.62rem;font-weight:400;opacity:.75;letter-spacing:0;}
.badge{background:var(--corail);color:#fff;font-size:.7rem;padding:4px 10px;border-radius:999px;white-space:nowrap;}
nav{background:var(--nuit2);position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding-bottom:env(safe-area-inset-bottom,0px);}
nav button{flex:1 0 60px;background:none;border:none;color:#CFD6E8;font-size:.72rem;padding:9px 4px 10px;min-height:56px;font-family:inherit;}
nav button .ic{display:block;font-size:1.35rem;line-height:1.4;}
nav button.on{color:#fff;background:var(--corail);}
h1{color:var(--nuit);font-size:1.5rem;margin:1.2rem 0 .4rem;}
h2{color:var(--nuit);font-size:1.2rem;margin:1.4rem 0 .5rem;}
h3{color:var(--nuit);font-size:1.02rem;margin:1rem 0 .35rem;}
p{margin:.5rem 0;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 3px rgba(31,42,68,.06);}
.btn{display:inline-block;min-height:44px;padding:10px 18px;border-radius:12px;border:none;background:var(--corail);color:#fff;font-size:1rem;font-family:inherit;cursor:pointer;}
.btn.sec{background:var(--nuit);}
.btn.ghost{background:#fff;color:var(--nuit);border:1.5px solid var(--nuit);}
.btn:disabled{opacity:.45;cursor:default;}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--corail-d);outline-offset:2px;}
.wordcard{background:#fff;border:1.5px solid var(--line);border-left:6px solid var(--corail);border-radius:14px;padding:14px 16px;margin:12px 0;}
.wfr{font-size:1.9rem;font-weight:700;color:var(--nuit);letter-spacing:.5px;}
.whz{font-size:1.5rem;color:var(--txt);}
.wpy{font-size:.85rem;color:var(--muted);}
.wex{font-size:.92rem;color:var(--muted);border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;}
.exfr{font-size:1.15rem;font-weight:600;color:var(--nuit);}
.pbar{background:var(--creme2);border-radius:999px;height:12px;overflow:hidden;border:1px solid var(--line);}
.pfill{background:linear-gradient(90deg,var(--corail),var(--corail-d));height:100%;border-radius:999px;transition:width .3s;}
.qopt{display:block;width:100%;text-align:left;min-height:48px;margin:8px 0;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:1.05rem;font-family:inherit;cursor:pointer;}
.qopt:hover{border-color:var(--corail);}
.tag{display:inline-block;font-size:.72rem;background:var(--creme2);color:var(--nuit);border-radius:999px;padding:2px 10px;margin-right:6px;}
.fbk{border-radius:10px;padding:10px 14px;margin-top:10px;font-size:.95rem;}
.fbk.ok{background:#E7F1E9;color:#2E5C3B;border:1px solid #BBD8C3;}
.fbk.bad{background:#F9E9E2;color:#7A3320;border:1px solid #E8C4B4;}
input.txt{width:100%;min-height:48px;font-size:1.15rem;padding:8px 12px;border-radius:12px;border:1.5px solid var(--nuit);background:#fff;font-family:inherit;}
.chip{display:inline-block;min-height:44px;min-width:44px;padding:8px 14px;margin:4px;border-radius:10px;border:1.5px solid var(--nuit);background:#fff;font-size:1.05rem;cursor:pointer;font-family:inherit;}
.chip.used{opacity:.35;cursor:default;}
.slotline{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;align-items:center;}
.okline{color:var(--ok);font-weight:700;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:420px){.grid2{grid-template-columns:1fr;}}
.wkcard{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;width:100%;text-align:left;font-family:inherit;cursor:pointer;}
.wknum{background:var(--nuit);color:#fff;width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;flex:none;}
.daybtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;font-family:inherit;font-size:.9rem;cursor:pointer;text-align:left;}
.daybtn .dn{font-weight:700;color:var(--nuit);}
.daybtn .dt{font-size:.78rem;color:var(--muted);}
.daybtn.done{border-color:var(--ok);background:#F0F7F1;}
.muted{color:var(--muted);font-size:.9rem;}
.center{text-align:center;}
.dictrow{display:flex;align-items:flex-start;gap:10px;}
.dictrow .grow{flex:1;}
.star{background:none;border:none;font-size:1.5rem;min-width:44px;min-height:44px;cursor:pointer;}
.motmsg{font-size:1.05rem;background:var(--creme2);border-left:5px solid var(--corail);border-radius:10px;padding:12px 14px;margin:10px 0;}
.kbd{font-size:.85rem;color:var(--muted);}
.hidden{display:none;}
a{color:var(--corail-d);}
ul{padding-left:1.2em;}

.lessonsteps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}
.lessonsteps a{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 9px;text-align:center;text-decoration:none;color:var(--nuit);font-weight:600;font-size:.85rem;min-height:48px}
h2[id]{scroll-margin-top:90px}
.qopt:focus-visible,.chip:focus-visible{outline:3px solid var(--corail-d);outline-offset:2px}
.pairgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairgrid button{width:100%;margin:5px 0;min-height:50px;overflow-wrap:anywhere}
.pairgrid button.selected{background:var(--creme2);border-color:var(--corail-d);box-shadow:inset 0 0 0 1px var(--corail-d)}
.pairgrid button.matched{background:#E7F1E9;border-color:var(--ok);opacity:.65}
@media(max-width:420px){html{font-size:16px}.badge{font-size:.62rem}.wordcard{padding:12px 13px}nav button{font-size:.67rem}}

.elixlink{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:9px 12px;min-height:44px;border-radius:10px;background:#E9EFF9;border:1px solid #B9CCE5;color:#1F2A44!important;text-decoration:none;font-size:.86rem;font-weight:650;}
.elixlink:hover,.elixlink:focus-visible{background:#D8E8FA;}
.elixnote{font-size:.8rem;color:var(--muted);margin-top:6px;line-height:1.5}
.elixintro{background:#F1F6FC;border:1px solid #C7D9EA;border-radius:12px;padding:12px 14px;margin:12px 0}

.v6visual{font-size:2.5rem;line-height:1.3;padding:4px 0 7px;user-select:none}
.v6dialog{background:#f7f9fc;border-color:#d8e1ec}
.v6bubble{background:#fff;border:1px solid #d8e1ec;padding:12px 14px;border-radius:13px;margin:10px 0;max-width:95%}
.v6bubble.answer{margin-left:auto;background:#eaf2f0}
.v6bubble strong{display:block;color:#1f2a44;font-size:1.08rem}
.v6bubble small{display:block;color:#5e655f;margin-top:3px;font-size:.88rem}
.v6review{padding:12px;margin-top:12px;border:1px solid var(--line);border-radius:13px}
.v6review .btn{margin:6px 5px 5px 0}

/* V8 : niveau progressif, sans dépendance externe */
.advanced-wrap{border:2px solid #62738f;border-radius:15px;padding:14px;margin:18px 0;background:#f3f6fb}
.advanced-wrap h3{margin-top:0}.advanced-details{margin-top:10px}
.advanced-details summary{display:block;cursor:pointer;background:var(--nuit);color:#fff;padding:12px 16px;border-radius:11px;font-weight:700;min-height:48px}
.advanced-details[open] summary{margin-bottom:12px}
.advanced-question{background:#fff;border:1px solid #d5dfed;border-radius:12px;padding:13px;margin:10px 0}
.advanced-question label{display:block;font-weight:650;margin:6px 0}
.advanced-question input{width:100%;max-width:100%;font-size:1.05rem;border:1.5px solid #72829b;border-radius:10px;padding:11px;font-family:inherit}
.advanced-result{margin-top:8px;font-size:.9rem;line-height:1.6}
.grammar-focus{background:#f3f7fc;border:1px solid #c8d8e9;border-radius:13px;padding:14px;margin:12px 0}
.grammar-focus table{border-collapse:collapse;width:100%;margin:8px 0;background:white}
.grammar-focus th,.grammar-focus td{text-align:left;padding:8px;border:1px solid #d6e0ed;font-size:.88rem}
.grammar-focus p{margin:8px 0}
.advanced-tip{color:#4b5568;font-size:.9rem}

/* V9: visual recall, mobile-first and accessible */
.v9callout{border-left:5px solid var(--corail);background:#fffaf2}
.v9tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.v9tabs .btn{font-size:.88rem;min-height:45px;padding:8px 12px}
.v9tabs .btn.active{background:var(--nuit);color:#fff}
.v9prompt{background:#f5f0e7;border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;margin:14px 0}
.v9symbol{font-size:2.6rem;font-weight:700;color:var(--nuit);line-height:1.45}
.v9cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:12px}
.v9cal span{font-size:.7rem;text-align:center;border:1px solid var(--line);border-radius:7px;padding:5px 1px;background:#fff;overflow:hidden}
.v9cal .active{background:var(--corail);color:#fff;font-weight:700}
.v9question{border:1px solid var(--line);background:#fff;padding:16px;border-radius:14px;margin:12px 0}
.v9question label{font-weight:700;display:block;margin-bottom:8px}.v9question input{margin:8px 0 6px}
.v9result{margin-top:9px}.v9result:empty{display:none}
@media(max-width:420px){.v9symbol{font-size:2.15rem}.v9cal span{font-size:.61rem}}
</style>

<body>
<header>
  <div class="hrow">
    <button class="logo" onclick="go('home')">清的法语小课堂<small>Le français avec Qing · V9</small></button>
    <span class="badge">无需听力</span>
  </div>
</header>
<main id="app" class="wrap"></main>
<nav id="nav"></nav>
<script>
"use strict";
/* ---------- 存储 ---------- */
var KEY="qingfr_v1"; // Clé historique inchangée : ne jamais renommer lors des mises à jour.
var SHADOW_KEY="qingfr_v1_safety_copy"; // Copie locale de secours, sur le même navigateur.
var storageWarning=false;
function isRecord(x){return !!x&&typeof x==="object"&&!Array.isArray(x);}
function isProgressData(d){return isRecord(d)&&Array.isArray(d.done)&&Array.isArray(d.fav)&&Array.isArray(d.err)&&isRecord(d.mynotes)&&(!d.memory||isRecord(d.memory));}
function normalizeProgress(d){
  d=isRecord(d)?d:{};
  return {done:Array.isArray(d.done)?d.done.filter(function(x){return typeof x==="string"&&/^([1-9]|1[0-2])-[1-5]$/.test(x);}):[],
    fav:Array.isArray(d.fav)?d.fav:[],err:Array.isArray(d.err)?d.err:[],
    mynotes:isRecord(d.mynotes)?d.mynotes:{},current:d.current||null,last:d.last||null,
    memory:isRecord(d.memory)?d.memory:{},practice:isRecord(d.practice)?d.practice:{}};
}
function load(){
  var d=null;
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){try{var main=JSON.parse(raw);if(isProgressData(main))d=main;}catch(parseError){/* Essayer la copie de secours. */}}
    // Restaurer la copie uniquement lorsque les données principales sont absentes ou illisibles.
    if(!d){var secondary=localStorage.getItem(SHADOW_KEY);if(secondary){var copy=JSON.parse(secondary);if(isProgressData(copy)){d=copy;localStorage.setItem(KEY,JSON.stringify(copy));}}}
  }catch(e){storageWarning=true;}
  return normalizeProgress(d);
}
var S=load();
function save(){
  S.last=Date.now();
  try{
    var raw=JSON.stringify(S);
    localStorage.setItem(KEY,raw);
    localStorage.setItem(SHADOW_KEY,raw);
    storageWarning=false;
  }catch(e){storageWarning=true;}
}
function storageNotice(){return storageWarning?'<div class="fbk bad" role="alert">⚠️ 浏览器无法保存学习记录。请检查是否使用无痕浏览，并先下载学习备份。学习期间不要清除网站数据。</div>':'';}
// Mettre à jour la copie de secours dès l'ouverture, y compris pour les anciennes versions.
if(!storageWarning)save();
function isDone(id){return S.done.indexOf(id)>=0;}
function toggleDone(id){if(!isDone(id))S.done.push(id);save();}
/* V6: espacements de revision, sans changer l'identifiant de sauvegarde V5 */
var REVIEW_DELAYS=[1,3,7,14];
function dayStamp(){return Math.floor(Date.now()/86400000);}
function memoryKey(fr){return String(fr).trim().toLowerCase();}
function encounterWords(l){
  if(!S.memory)S.memory={};
  l.words.forEach(function(w){var k=memoryKey(w[0]);
    if(!S.memory[k])S.memory[k]={stage:0,due:dayStamp()+1,seen:dayStamp(),ok:0};
  });save();
}
function dueItems(){
  if(!S.memory)S.memory={};
  var w=allWords(),seen={};
  return w.filter(function(item){var k=memoryKey(item.fr);if(seen[k])return false;seen[k]=1;return S.memory[k]&&S.memory[k].due<=dayStamp();});
}
function answerMemory(fr,ok){
 var k=memoryKey(fr),r=S.memory[k]||{stage:0,seen:dayStamp(),ok:0};
 if(ok){r.stage=Math.min(4,(r.stage||0)+1);r.ok=(r.ok||0)+1;r.due=dayStamp()+REVIEW_DELAYS[Math.min(r.stage-1,3)];}
 else{r.stage=0;r.due=dayStamp()+1;}
 S.memory[k]=r;save();
}

/* ---------- 数据：60 课（12周 × 5天） ----------
   J1–J4 每天新内容；J5 为本周复习（由程序自动汇总本周词汇与句子生成）。
   拼音只标注汉字（拼音是汉语的注音，不是法语发音）。 */
function L(w,d,th,goal,words,gram,ex,exs){return {w:w,d:d,th:th,goal:goal,words:words,gram:gram,ex:ex,exs:exs};}
var LESSONS=[];
/* ===== 第1周：认识与问候 ===== */
LESSONS.push(L(1,1,"第一次见面：你好和谢谢",
"今天先学 4 个词和 1 句话：认识「我 / 你 / 你好 / 谢谢」，并看懂「我是Qing」。",
[["bonjour","你好","nǐ hǎo"],["merci","谢谢","xiè xie"],["je","我","wǒ"],["tu","你","nǐ"]],
"先认识两个简单对应：je = 我，tu = 你。但法语和中文的句子结构不同，不能永远一个字对应一个字。注意：卡片上的拼音是<strong>汉字的读音</strong>（帮助你确认中文），它<strong>不是</strong>法语的发音。法语我们只学「读和写」，不学「说和听」。",
[["Je suis Qing.","我是Qing。"],["Bonjour !","你好！"],["Merci !","谢谢！"]],
[{"t":"mcq","q":"「你好」的法语怎么写？","o":["bonjour","merci","je"],"a":0,"exp":"bonjour = 你好。"},
 {"t":"mcq","q":"下面哪个词表示「我」？","o":["tu","je","merci"],"a":1,"exp":"je = 我；tu = 你。"},
 {"t":"fill","q":"填空：____ suis Qing.（我是Qing。）","a":"je","exp":"je = 我。注意法语习惯首字母大写，但小写也算对。"}]));
LESSONS.push(L(1,2,"我、你、他、她",
"复习昨天的词，再加上「他 / 她」。法语里 il 和 elle 写法不同，一看就分清。",
[["il","他","tā"],["elle","她","tā"],["chinois","中国人（男）","zhōngguó rén"],["chinoise","中国人（女）","zhōngguó rén"]],
"法语的 il = 他，elle = 她：写法不同，靠眼睛就能区分。中文的“他”和“她”读音相同（tā），但汉字不同；法语也用两个不同的词。中文「中国人」不分男女，法语要在词尾加 -e 表示女性：chinois / chinoise。",
[["Il est chinois.","他是中国人。"],["Elle est chinoise.","她是中国人。"],["Tu es Qing ?","你是Qing吗？"]],
[{"t":"mcq","q":"「她是中国人」里应该用哪个词？","o":["il","elle","je"],"a":1,"exp":"女性用 elle（她）。"},
 {"t":"fill","q":"填空：Elle est ________.（她是中国人。）","a":"chinoise","exp":"女性写 chinoise，词尾多一个 e。"},
 {"t":"mcq","q":"昨天学的「我是Qing」，完整写一遍：","o":["Je suis Qing","Je est Qing","Tu suis Qing"],"a":0,"exp":"固定搭配：je suis = 我是。"}]));
LESSONS.push(L(1,3,"你叫什么名字？",
"学会问名字和回答：comment / appeler / je m'appelle。今天只有一个新句型。",
[["comment","怎么","zěn me"],["s'appeler","叫（名字）","jiào"],["je m'appelle…","我叫……","wǒ jiào"],["et toi ?","你呢？","nǐ ne"]],
"法语问名字说 Comment tu t'appelles ?（你叫什么）。回答用 je m'appelle + 名字（我叫……）。这里的 m' 是「我自己」的意思，先整体记住这个句型，不拆开分析。",
[["Comment tu t'appelles ?","你叫什么名字？"],["Je m'appelle Qing.","我叫Qing。"],["Je m'appelle Qing. Et toi ?","我叫Qing。你呢？"]],
[{"t":"order","w":["Je","m'appelle","Qing"],"a":"Je m'appelle Qing","q":"把词排成「我叫Qing」：","exp":"je m'appelle = 我叫，后面直接接名字。"},
 {"t":"fill","q":"填空：Comment tu t'______ ?（你叫什么名字？）","a":"appelles","exp":"s'appeler 的问句形式，整体记住即可。"},
 {"t":"mcq","q":"「我叫Qing」怎么说？","o":["Je m'appelle Qing","Je suis appelle Qing","Comment Qing"],"a":0,"exp":"je m'appelle + 名字。"}]));
LESSONS.push(L(1,4,"我是聋人，我用LSF",
"学会介绍自己：sourde（聋的）、LSF（法国手语）。同时弄清：手语和书面法语是两种语言。",
[["sourd / sourde","聋的（男/女）","lóng"],["la langue des signes","手语","shǒu yǔ"],["LSF","法国手语（缩写）","fǎguó shǒu yǔ"],["lire","读 / 看（文字）","dú"],["écrire","写","xiě"]],
"LSF 是<strong>法国手语</strong>，它和书面法语是两种独立的语言，就像汉语和手语也不是一回事。介绍自己可以说：Je suis sourde.（我是聋人。）Je lis le français.（我能读法语。）我们这个课堂学习法语的阅读与写作，不需要听力。",
[["Je suis sourde.","我是聋人。"],["Je lis le français.","我读法语。"],["J'écris un message.","我写一条消息。"]],
[{"t":"mcq","q":"女性说「我是聋人」：","o":["Je suis sourd","Je suis sourde","Il est sourde"],"a":1,"exp":"女性词尾加 e：sourde。"},
 {"t":"mcq","q":"LSF 指的是：","o":["法国手语","法国美食","法国城市"],"a":0,"exp":"LSF = langue des signes française，法国手语。"},
 {"t":"fill","q":"填空：Je ______ le français.（我读法语。）","a":"lis","exp":"lire 的「我」形式是 lis。"}]));
/* ===== 第2周：家庭 ===== */
LESSONS.push(L(2,1,"我的家人（一）",
"认识家庭基础词：famille / père / mère，并用 mon（我的）连起来。",
[["la famille","家庭 / 家人","jiārén"],["le père","父亲","fùqīn"],["la mère","母亲","mǔqīn"],["mon","我的（男性/中性词前）","wǒ de"],["ma","我的（女性词前）","wǒ de"]],

function fbEl(ok,txt){var d=document.createElement("div");d.className="fbk "+(ok?"ok":"bad");d.innerHTML=(ok?"✓ 对了！":"✗ 再看一眼：")+txt;return d;}
function markDone(){exState.done++; if(exState.done>=exState.total){var f=document.getElementById("finbox");if(f&&!f.querySelector(".donetag")){var t=document.createElement("p");t.className="donetag okline";t.textContent="✓ 练习全部完成，可以点「完成本课」了！";f.insertBefore(t,f.firstChild);}}}
function buildEx(e,i,l){
  var d=document.createElement("div");d.className="card";
  var types={mcq:"选择",fill:"填空",order:"排列",match:"配对"};
  var t=document.createElement("p");t.innerHTML='<span class="tag">'+(i+1)+'/'+exState.total+' · '+(types[e.t]||"练习")+'</span> '+esc(e.q||"找出正确的法语和中文配对：");d.appendChild(t);
  var solved=false,failedOnce=false;
  function show(ok,msg){
    var old=d.querySelector(".fbk");if(old)old.remove();
    d.appendChild(fbEl(ok,msg));
    if(ok&&!solved){solved=true;markDone();}
    if(!ok&&!failedOnce){failedOnce=true;logErr((l?l.th:"")+": "+(e.q||"配对"));}
  }
  if(e.t==="mcq"){
    shuffle(e.o.slice()).forEach(function(o){
      var b=document.createElement("button");b.className="qopt";b.textContent=o;
      b.onclick=function(){if(solved)return;var ok=e.o[e.a]===o;
        d.querySelectorAll(".qopt").forEach(function(x){x.classList.remove("correct","wrong");});
        b.classList.add(ok?"correct":"wrong");show(ok,ok?(e.exp||"很好！"):"还不是这个答案，再试一次。");};d.appendChild(b);
    });
  }else if(e.t==="fill"){
    var inp=document.createElement("input");inp.className="txt";inp.setAttribute("aria-label","请填写法语答案");inp.autocomplete="off";d.appendChild(inp);
    var b=document.createElement("button");b.className="btn";b.style.marginTop="10px";b.textContent="检查";
    b.onclick=function(){if(solved)return;var ok=norm(inp.value)===norm(e.a);show(ok,ok?(e.exp||"很好！"):"再试一次。提示："+(e.exp||"请仔细看上面的词语。"));};
    inp.addEventListener("keydown",function(ev){if(ev.key==="Enter")b.click();});d.appendChild(b);
  }else if(e.t==="order"){
    var selected=[],parts=e.w.map(function(v,j){return{word:v,id:j};}),mixed=shuffle(parts);
    var slot=document.createElement("div");slot.className="slotline";d.appendChild(slot);
    var pool=document.createElement("div");d.appendChild(pool);
    function draw(){slot.innerHTML="";pool.innerHTML="";
      selected.forEach(function(p,j){var b=document.createElement("button");b.className="chip";b.textContent=p.word;b.title="点这里撤销这个词";b.onclick=function(){if(solved)return;selected.splice(j,1);draw();};slot.appendChild(b);});
      mixed.filter(function(p){return !selected.some(function(x){return x.id===p.id;});}).forEach(function(p){var b=document.createElement("button");b.className="chip";b.textContent=p.word;b.onclick=function(){if(solved)return;selected.push(p);draw();};pool.appendChild(b);});
      if(!selected.length)slot.textContent="按顺序点击下面的法语词";
    }
    draw();
    var b=document.createElement("button");b.className="btn";b.textContent="检查";
    b.onclick=function(){if(solved)return;var ok=norm(selected.map(function(x){return x.word;}).join(" "))===norm(e.a);show(ok,ok?(e.exp||"非常好！"):"词语顺序还不对，可以点上面的词撤销后再试。")};d.appendChild(b);
  }else if(e.t==="match"){
    var words=e.pairs.map(function(p,j){return{fr:p[0],zh:p[1],id:j};});
    var left=document.createElement("div"),right=document.createElement("div"),grid=document.createElement("div");grid.className="pairgrid";grid.appendChild(left);grid.appendChild(right);d.appendChild(grid);
    var selected=-1,matched=[];
    words.forEach(function(p){var b=document.createElement("button");b.className="chip";b.textContent=p.fr;b.setAttribute("data-fri",p.id);b.onclick=function(){if(solved||matched.includes(p.id))return;selected=p.id;refresh();};left.appendChild(b);});
    shuffle(words).forEach(function(p){var b=document.createElement("button");b.className="chip";b.textContent=p.zh;b.setAttribute("data-zhi",p.id);b.onclick=function(){if(solved||matched.includes(p.id)||selected<0)return;
      if(selected===p.id){matched.push(p.id);selected=-1;refresh();if(matched.length===words.length)show(true,"全部配对正确！");}
      else{selected=-1;refresh();show(false,"还不对，请重新选择一组词语。");}
    };right.appendChild(b);});
    function refresh(){d.querySelectorAll("[data-fri]").forEach(function(b){var id=Number(b.dataset.fri);b.classList.toggle("selected",id===selected);b.classList.toggle("matched",matched.includes(id));b.disabled=matched.includes(id);});d.querySelectorAll("[data-zhi]").forEach(function(b){var id=Number(b.dataset.zhi);b.classList.toggle("matched",matched.includes(id));b.disabled=matched.includes(id);});}
  }
  return d;
}

function importQingBackup(input){
  var file=input.files&&input.files[0];if(!file)return;
  if(file.size>2*1024*1024){alert("备份文件太大，无法导入。");input.value="";return;}
  var reader=new FileReader();
  reader.onerror=function(){alert("无法读取这个文件。");input.value="";};
  reader.onload=function(){
    try{
      var obj=JSON.parse(reader.result);
      if(obj.format!=="qing-francais-backup"||obj.version!==1||!obj.data||!Array.isArray(obj.data.done)||!Array.isArray(obj.data.fav)||!Array.isArray(obj.data.err)||!obj.data.mynotes||typeof obj.data.mynotes!=="object"||!obj.data.memory||typeof obj.data.memory!=="object")throw Error("format");
      var d=obj.data;
      if(d.done.length>200||d.fav.length>2000||d.err.length>300)throw Error("volume");
      if(!d.done.every(function(x){return typeof x==="string"&&/^([1-9]|1[0-2])-[1-5]$/.test(x);})||!d.fav.every(function(x){return typeof x==="string"&&x.length<120;}))throw Error("fields");
      var notes=Object.keys(d.mynotes),keys=Object.keys(d.memory);
      if(notes.length>65||keys.length>2000||!notes.every(function(k){return /^([1-9]|1[0-2])-[1-5]$/.test(k)&&typeof d.mynotes[k]==="string"&&d.mynotes[k].length<10000;}))throw Error("notes");
      if(!keys.every(function(k){var r=d.memory[k];return k.length<120&&r&&typeof r==="object"&&Number.isFinite(r.due)&&r.due>=0&&Number.isFinite(r.stage)&&r.stage>=0&&r.stage<=4&&Number.isFinite(r.ok)&&r.ok>=0;}))throw Error("memory");
      if(!confirm("确定要合并这个备份吗？已经完成的课程、收藏和当前笔记都不会被删除。"))return;
      // Fusion sans perte : même un fichier plus ancien ne doit pas effacer le travail récent.
      var combined=normalizeProgress(S);
      combined.done=Array.from(new Set(combined.done.concat(d.done)));
      combined.fav=Array.from(new Set(combined.fav.concat(d.fav)));
      combined.err=combined.err.concat(d.err).slice(-300);
      Object.keys(d.mynotes).forEach(function(id){if(!combined.mynotes[id]&&d.mynotes[id])combined.mynotes[id]=d.mynotes[id];});
      Object.keys(d.memory).forEach(function(k){
        var old=combined.memory[k],incoming=d.memory[k];
        if(!old){combined.memory[k]=incoming;return;}
        if((incoming.stage||0)>(old.stage||0)||((incoming.stage||0)===(old.stage||0)&&(incoming.ok||0)>(old.ok||0)))combined.memory[k]=incoming;
      });
      if(!combined.current)combined.current=d.current||null;
      S=combined;save();go("progress");alert("学习记录已安全合并！以前完成的课程都保留了。");
    }catch(e){alert("这个文件不是有效的学习备份，请检查文件。 ");}
    finally{input.value="";}
  };
  reader.readAsText(file,"utf-8");
}

var V9_CAT='numbers', V9_INDEX=0, V9_WRONG=0;
function v9State(){if(!isRecord(S.practice))S.practice={};return S.practice;}
function v9Key(cat,i){return cat+':'+i;}
function v9DueCount(){var p=v9State(),today=dayStamp();return Object.keys(p).filter(function(k){return p[k]&&p[k].due<=today;}).length;}
function v9Select(cat){if(!V9_TASKS[cat])return;V9_CAT=cat;V9_WRONG=0;var today=dayStamp(),p=v9State();var due=V9_TASKS[cat].findIndex(function(t,i){return p[v9Key(cat,i)]&&p[v9Key(cat,i)].due<=today;});
 var untried=V9_TASKS[cat].findIndex(function(t,i){return !p[v9Key(cat,i)];});V9_INDEX=due>=0?due:untried>=0?untried:0;renderMemoryLab();}
function v9Advance(){V9_INDEX=(V9_INDEX+1)%V9_TASKS[V9_CAT].length;V9_WRONG=0;renderMemoryLab();}
function v9Norm(v){return String(v||'').normalize('NFC').toLowerCase().replace(/[\s.,!?;:'’]+/g,' ').trim();}
function v9Mark(ok){var p=v9State(),k=v9Key(V9_CAT,V9_INDEX),previous=p[k]||{stage:0,attempts:0,correct:0};previous.attempts++;
 if(ok){previous.stage=Math.min(4,(previous.stage||0)+1);previous.correct++;previous.due=dayStamp()+[1,3,7,14][previous.stage-1];}else{previous.stage=0;previous.due=dayStamp()+1;}
 p[k]=previous;save();}

 var t=V9_TASKS[V9_CAT][V9_INDEX],answer=v9Norm(input.value);if(!answer){out.textContent='先写下你的答案。';return;}
