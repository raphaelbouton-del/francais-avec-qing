<style>
:root{
  --creme:#FBF7EF; --creme2:#F3ECDD; --nuit:#1F2A44; --nuit2:#2A3855;
  --corail:#E8907A; --corail-d:#C96A52; --ok:#4C8A5C; --bad:#B4573F;
  --txt:#2B2B2B; --muted:#6B6355; --line:#E4DAC8;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{font-size:18px;}
body{margin:0;background:var(--creme);color:var(--txt);

.logo{font-size:1.05rem;font-weight:700;letter-spacing:.5px;cursor:pointer;background:none;border:none;color:#fff;padding:8px 0;}

nav button{flex:1;background:none;border:none;color:#CFD6E8;font-size:.72rem;padding:9px 4px 10px;min-height:56px;font-family:inherit;}
nav button .ic{display:block;font-size:1.35rem;line-height:1.4;}
nav button.on{color:#fff;background:var(--corail);}
h1{color:var(--nuit);font-size:1.5rem;margin:1.2rem 0 .4rem;}
h2{color:var(--nuit);font-size:1.2rem;margin:1.4rem 0 .5rem;}
h3{color:var(--nuit);font-size:1.02rem;margin:1rem 0 .35rem;}
p{margin:.5rem 0;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 3px rgba(31,42,68,.06);}

.whz{font-size:1.5rem;color:var(--txt);}
.wpy{font-size:.85rem;color:var(--muted);}
.wex{font-size:.92rem;color:var(--muted);border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;}
.exfr{font-size:1.15rem;font-weight:600;color:var(--nuit);}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.muted{color:var(--muted);font-size:.9rem;}
.center{text-align:center;}
.dictrow{display:flex;align-items:flex-start;gap:10px;}
.dictrow .grow{flex:1;}
.star{background:none;border:none;font-size:1.5rem;min-width:44px;min-height:44px;cursor:pointer;}

.kbd{font-size:.85rem;color:var(--muted);}
.hidden{display:none;}
a{color:var(--corail-d);}
ul{padding-left:1.2em;}

.lessonsteps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}
.lessonsteps a{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 9px;text-align:center;text-decoration:none;color:var(--nuit);font-weight:600;font-size:.85rem;min-height:48px}
h2[id]{scroll-margin-top:90px}
.qopt:focus-visible,.chip:focus-visible{outline:3px solid var(--corail-d);outline-offset:2px}
.pairgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairgrid button{width:100%;margin:5px 0;min-height:50px;overflow-wrap:anywhere}
.pairgrid button.selected{background:var(--creme2);border-color:var(--corail-d);box-shadow:inset 0 0 0 1px var(--corail-d)}
.pairgrid button.matched{background:#E7F1E9;border-color:var(--ok);opacity:.65}
@media(max-width:420px){html{font-size:16px}.badge{font-size:.62rem}.wordcard{padding:12px 13px}nav button{font-size:.67rem}}

.elixlink{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:9px 12px;min-height:44px;border-radius:10px;background:#E9EFF9;border:1px solid #B9CCE5;color:#1F2A44!important;text-decoration:none;font-size:.86rem;font-weight:650;}
.elixlink:hover,.elixlink:focus-visible{background:#D8E8FA;}
.elixnote{font-size:.8rem;color:var(--muted);margin-top:6px;line-height:1.5}
.elixintro{background:#F1F6FC;border:1px solid #C7D9EA;border-radius:12px;padding:12px 14px;margin:12px 0}

<script>
"use strict";
/* ---------- 存储 ---------- */
var KEY="qingfr_v1";
var S=load();
function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||"{}");}catch(e){var d={};}
  return {done:d.done||[],fav:d.fav||[],err:d.err||[],mynotes:d.mynotes||{},current:d.current||null,last:d.last||null};}
function save(){S.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function isDone(id){return S.done.indexOf(id)>=0;}
function toggleDone(id){if(!isDone(id))S.done.push(id);save();}

/* ---------- 数据：60 课（12周 × 5天） ----------
   J1–J4 每天新内容；J5 为本周复习（由程序自动汇总本周词汇与句子生成）。
   拼音只标注汉字（拼音是汉语的注音，不是法语发音）。 */
function L(w,d,th,goal,words,gram,ex,exs){return {w:w,d:d,th:th,goal:goal,words:words,gram:gram,ex:ex,exs:exs};}
var LESSONS=[];
/* ===== 第1周：认识与问候 ===== */
LESSONS.push(L(1,1,"第一次见面：你好和谢谢",
"今天先学 4 个词和 1 句话：认识「我 / 你 / 你好 / 谢谢」，并看懂「我是Qing」。",
[["bonjour","你好","nǐ hǎo"],["merci","谢谢","xiè xie"],["je","我","wǒ"],["tu","你","nǐ"]],
"先认识两个简单对应：je = 我，tu = 你。但法语和中文的句子结构不同，不能永远一个字对应一个字。注意：卡片上的拼音是<strong>汉字的读音</strong>（帮助你确认中文），它<strong>不是</strong>法语的发音。法语我们只学「读和写」，不学「说和听」。",
[["Je suis Qing.","我是Qing。"],["Bonjour !","你好！"],["Merci !","谢谢！"]],
[{"t":"mcq","q":"「你好」的法语怎么写？","o":["bonjour","merci","je"],"a":0,"exp":"bonjour = 你好。"},
 {"t":"mcq","q":"下面哪个词表示「我」？","o":["tu","je","merci"],"a":1,"exp":"je = 我；tu = 你。"},
 {"t":"fill","q":"填空：____ suis Qing.（我是Qing。）","a":"je","exp":"je = 我。注意法语习惯首字母大写，但小写也算对。"}]));
LESSONS.push(L(1,2,"我、你、他、她",
"复习昨天的词，再加上「他 / 她」。法语里 il 和 elle 写法不同，一看就分清。",
[["il","他","tā"],["elle","她","tā"],["chinois","中国人（男）","zhōngguó rén"],["chinoise","中国人（女）","zhōngguó rén"]],
"法语的 il = 他，elle = 她：写法不同，靠眼睛就能区分。中文的“他”和“她”读音相同（tā），但汉字不同；法语也用两个不同的词。中文「中国人」不分男女，法语要在词尾加 -e 表示女性：chinois / chinoise。",
[["Il est chinois.","他是中国人。"],["Elle est chinoise.","她是中国人。"],["Tu es Qing ?","你是Qing吗？"]],
[{"t":"mcq","q":"「她是中国人」里应该用哪个词？","o":["il","elle","je"],"a":1,"exp":"女性用 elle（她）。"},
 {"t":"fill","q":"填空：Elle est ________.（她是中国人。）","a":"chinoise","exp":"女性写 chinoise，词尾多一个 e。"},
 {"t":"mcq","q":"昨天学的「我是Qing」，完整写一遍：","o":["Je suis Qing","Je est Qing","Tu suis Qing"],"a":0,"exp":"固定搭配：je suis = 我是。"}]));
LESSONS.push(L(1,3,"你叫什么名字？",
"学会问名字和回答：comment / appeler / je m'appelle。今天只有一个新句型。",
[["comment","怎么","zěn me"],["s'appeler","叫（名字）","jiào"],["je m'appelle…","我叫……","wǒ jiào"],["et toi ?","你呢？","nǐ ne"]],
"法语问名字说 Comment tu t'appelles ?（你叫什么）。回答用 je m'appelle + 名字（我叫……）。这里的 m' 是「我自己」的意思，先整体记住这个句型，不拆开分析。",
[["Comment tu t'appelles ?","你叫什么名字？"],["Je m'appelle Qing.","我叫Qing。"],["Je m'appelle Qing. Et toi ?","我叫Qing。你呢？"]],
[{"t":"order","w":["Je","m'appelle","Qing"],"a":"Je m'appelle Qing","q":"把词排成「我叫Qing」：","exp":"je m'appelle = 我叫，后面直接接名字。"},
 {"t":"fill","q":"填空：Comment tu t'______ ?（你叫什么名字？）","a":"appelles","exp":"s'appeler 的问句形式，整体记住即可。"},
 {"t":"mcq","q":"「我叫Qing」怎么说？","o":["Je m'appelle Qing","Je suis appelle Qing","Comment Qing"],"a":0,"exp":"je m'appelle + 名字。"}]));
LESSONS.push(L(1,4,"我是聋人，我用LSF",
"学会介绍自己：sourde（聋的）、LSF（法国手语）。同时弄清：手语和书面法语是两种语言。",
[["sourd / sourde","聋的（男/女）","lóng"],["la langue des signes","手语","shǒu yǔ"],["LSF","法国手语（缩写）","fǎguó shǒu yǔ"],["lire","读 / 看（文字）","dú"],["écrire","写","xiě"]],
"LSF 是<strong>法国手语</strong>，它和书面法语是两种独立的语言，就像汉语和手语也不是一回事。介绍自己可以说：Je suis sourde.（我是聋人。）Je lis le français.（我能读法语。）我们这个课堂学习法语的阅读与写作，不需要听力。",
[["Je suis sourde.","我是聋人。"],["Je lis le français.","我读法语。"],["J'écris un message.","我写一条消息。"]],
[{"t":"mcq","q":"女性说「我是聋人」：","o":["Je suis sourd","Je suis sourde","Il est sourde"],"a":1,"exp":"女性词尾加 e：sourde。"},
 {"t":"mcq","q":"LSF 指的是：","o":["法国手语","法国美食","法国城市"],"a":0,"exp":"LSF = langue des signes française，法国手语。"},
 {"t":"fill","q":"填空：Je ______ le français.（我读法语。）","a":"lis","exp":"lire 的「我」形式是 lis。"}]));
/* ===== 第2周：家庭 ===== */
LESSONS.push(L(2,1,"我的家人（一）",
"认识家庭基础词：famille / père / mère，并用 mon（我的）连起来。",
[["la famille","家庭 / 家人","jiārén"],["le père","父亲","fùqīn"],["la mère","母亲","mǔqīn"],["mon","我的（男性/中性词前）","wǒ de"],["ma","我的（女性词前）","wǒ de"]],
"多数法语名词都分「阴阳性」，像两堆卡片：le père 用 mon（我的），la mère 用 ma（我的）。中文的「我的」不区分名词阴阳性，法语常用 mon 或 ma。不用急，先记住：père→mon，mère→ma。",
[["Voici ma famille.","这是我的家人。"],["Mon père est en Chine.","我的父亲在中国。"],["Ma mère est là.","我的母亲在这里。"]],
[{"t":"mcq","q":"「我的母亲」，mon 还是 ma？","o":["mon père","ma mère"],"a":1,"exp":"mère 是阴性，用 ma。"},
 {"t":"fill","q":"填空：Mon ______ est en Chine.（我的父亲在中国。）","a":"père","exp":"père = 父亲。"},
 {"t":"mcq","q":"famille 是什么意思？","o":["家庭","朋友","城市"],"a":0,"exp":"la famille = 家庭/家人。"}]));
LESSONS.push(L(2,2,"兄弟姐妹和孩子",
"加上 frère / sœur / fils / fille，学会「我有……」。",
[["le frère","兄弟","xiōngdì"],["la sœur","姐妹","jiěmèi"],["le fils","儿子","érzi"],["la fille","女儿 / 女孩","nǚ'ér"],["j'ai","我有","wǒ yǒu"]],
"今天的重点是 j'ai = 我有。注意：j'ai 是两个词 je + ai 的缩写（省掉了一个字母），意思等于中文「我有」。看多了就认识了。",
[["J'ai un frère.","我有一个兄弟。"],["J'ai une sœur.","我有一个姐妹。"],["J'ai deux enfants.","我有两个孩子。"]],
[{"t":"fill","q":"填空：J'____ une sœur.（我有一个姐妹。）","a":"ai","exp":"j'ai = 我有，固定写法。"},
 {"t":"mcq","q":"「女儿」是：","o":["le fils","la fille","le frère"],"a":1,"exp":"la fille = 女儿/女孩；le fils = 儿子。"},
 {"t":"order","w":["J'ai","un","frère"],"a":"J'ai un frère","q":"把词排成「我有一个兄弟」：","exp":"j'ai + 数量 + 名词。"}]));
LESSONS.push(L(2,3,"丈夫、妻子和小家庭",
"学会 mari / femme / enfant，并能简单介绍家人。",
[["le mari","丈夫","zhàngfu"],["la femme","妻子 / 女人","qīzi"],["l'enfant","孩子","háizi"],["nous","我们","wǒmen"],["et","和 / 与","hé"]],
"一个提醒：la femme 指「妻子」，也可以指「女人」，看句子判断。nous = 我们，对应 je（我）的复数。今天句型：Voici mon mari.（这是我丈夫。）",
[["Voici mon mari.","这是我丈夫。"],["Voici ma femme.","这是我妻子。"],["Nous avons un enfant.","我们有一个孩子。"]],
[{"t":"mcq","q":"「这是我们妻子」对吗？应该选正确的：","o":["Voici ma femme","Voici mon femme","Voici ma mari"],"a":0,"exp":"femme 阴性用 ma；mari 阳性用 mon。"},
 {"t":"fill","q":"填空：Nous ______ un enfant.（我们有一个孩子。）","a":"avons","exp":"nous avons = 我们有。"},
 {"t":"mcq","q":"l'enfant 的意思是：","o":["朋友","孩子","父母"],"a":1,"exp":"l'enfant = 孩子。"}]));
LESSONS.push(L(2,4,"长辈和家人的称呼",
"认识 grand-mère / grand-père / parents，并复习整周的家庭词。",
[["la grand-mère","祖母 / 外婆","zǔmǔ"],["le grand-père","祖父 / 外公","zǔfù"],["les parents","父母","fùmǔ"],["avec","和……一起","hé…yīqǐ"],["aussi","也","yě"]],
"法语 grand-mère 是 grand（大）+ mère（母亲）拼成的，字面上像「大母亲」= 祖母。拼词记忆比死记更容易。aussi = 也，放在句子最后：Ma sœur est là aussi.",
[["Ma grand-mère est en Chine.","我的祖母在中国。"],["Je suis avec ma famille.","我和家人在一起。"],["Mon grand-père lit aussi.","我的祖父也读书。"]],
[{"t":"fill","q":"填空：Ma grand-______ est en Chine.（我的祖母在中国。）","a":"mère","exp":"grand-mère = 祖母。"},
 {"t":"mcq","q":"「父母」是：","o":["les parents","les enfants","la famille"],"a":0,"exp":"les parents = 父母；les enfants = 孩子们。"},
 {"t":"mcq","q":"aussi 的意思是：","o":["也","和","但是"],"a":0,"exp":"aussi = 也，常放句尾。"}]));
/* ===== 第3周：数字、时间和日期 ===== */
LESSONS.push(L(3,1,"数字 1–5",
"会认会写 un / deux / trois / quatre / cinq，并用「我有……」造句。",
[["un","一（个）","yī"],["deux","二","èr"],["trois","三","sān"],["quatre","四","sì"],["cinq","五","wǔ"]],
"数字不难：先记住 1 到 5。注意 un 除了「一」，也当「一个」讲（un frère = 一个兄弟），第2周已经见过它了。",
[["J'ai deux frères.","我有两个兄弟。"],["Trois enfants.","三个孩子。"],["Un café, s'il vous plaît.","请来一杯咖啡。"]],
[{"t":"mcq","q":"「三」怎么写？","o":["trois","deux","cinq"],"a":0,"exp":"trois = 三。"},
 {"t":"fill","q":"填空：J'ai ______ enfants.（我有两个孩子。）","a":"deux","exp":"deux = 二/两。"},
 {"t":"order","w":["quatre","cinq","et"],"a":"quatre et cinq","q":"把词排成「四和五」：","exp":"et = 和。"}]));
LESSONS.push(L(3,2,"数字 6–10 和电话号码",
"认识六到十，学会看懂一个号码。数字是 WhatsApp 消息里最常用的。",
[["six","六","liù"],["sept","七","qī"],["huit","八","bā"],["neuf","九","jiǔ"],["dix","十","shí"]],
"提醒：sept（七）和 huit（八）里都有不发音的字母，我们只管写，不用管读音。看号码时一个一个数认即可。",
[["Mon numéro : 06 12 34 56 78.","我的号码：06 12 34 56 78。"],["Dix minutes.","十分钟。"],["Six messages.","六条消息。"]],
[{"t":"mcq","q":"「八」怎么写？","o":["huit","neuf","six"],"a":0,"exp":"huit = 八。"},
 {"t":"fill","q":"填空：neuf + un = ______（九加一等于？用法语数字写）","a":"dix","exp":"dix = 十。"},

function rid(w,d){return w+"-"+d;}
function getLesson(w,d){return ALL.find(function(l){return l.w===w&&l.d===d;});}
function weekLessons(w){return LESSONS.filter(function(l){return l.w===w;});}
function mkReview(w){
  var ls=weekLessons(w),words=[],examples=[];
  ls.forEach(function(l){words.push(l.words[0]);if(l.words[1])words.push(l.words[1]);if(l.ex[0])examples.push(l.ex[0]);});
  words=words.slice(0,4);examples=examples.slice(0,2);
  var a=words[0],b=words[1],c=words[2];
  var questions=[
    {t:"mcq",q:"「"+a[1]+"」的法语是什么？",o:[a[0],b[0],c[0]],a:0,exp:a[0]+" = "+a[1]+"。"},
    {t:"fill",q:"请写出「"+b[1]+"」的法语：",a:b[0],exp:b[0]+" = "+b[1]+"。"},
    {t:"match",pairs:words.slice(0,4)}
  ];
  return L(w,5,"本周轻松复习","今天不学新内容。看看这周见过的词，再做三个小游戏。",words,
    "复习没有考试，也没有计时。想不起来就回到前面的课程看看。",examples,questions);
}
function allLessons(){
  var all=LESSONS.slice();
  for(var w=1;w<=12;w++){all.push(mkReview(w));}
  all.sort(function(a,b){return a.w-b.w||a.d-b.d;});
  return all;
}

var ELIX_TERMS={
 "bonjour":"bonjour","merci":"merci","je":"je","tu":"tu", "il":"il", "elle":"elle",
 "oui":"oui","non":"non","salut":"salut","famille":"famille","père":"père",

 "ami":"ami","amie":"amie"
};
function elixTerm(word){
  var t=String(word||"").trim().toLowerCase();
  // Les variantes avec article le/la/l' sont cherchées sous leur lemme.
  t=t.replace(/^(le |la |les |l')/,"");
  return Object.prototype.hasOwnProperty.call(ELIX_TERMS,t)?ELIX_TERMS[t]:null;
}
function elixButton(word){
  var term=elixTerm(word);
  if(!term)return "";
  var url="https://dico.elix-lsf.fr/dictionnaire/"+encodeURIComponent(term);
  return '<a class="elixlink" href="'+url+'" target="_blank" rel="noopener noreferrer" aria-label="在 Elix 查询 '+esc(term)+' 的 LSF 手语">🤟 在 Elix 查看 LSF ↗</a>';
}
/* ---------- 工具 ---------- */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function norm(s){return String(s).normalize("NFC").toLowerCase().replace(/[.,!?;:'’«»\s]+/g," ").trim();}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function finishLesson(w,d){

  else renderLesson({w:w,d:d});
}

  exs.forEach(function(e,i){box.appendChild(buildEx(e,i,l));});
}
function fbEl(ok,txt){var d=document.createElement("div");d.className="fbk "+(ok?"ok":"bad");d.innerHTML=(ok?"✓ 对了！":"✗ 再看一眼：")+txt;return d;}
function markDone(){exState.done++; if(exState.done>=exState.total){var f=document.getElementById("finbox");if(f&&!f.querySelector(".donetag")){var t=document.createElement("p");t.className="donetag okline";t.textContent="✓ 练习全部完成，可以点「完成本课」了！";f.insertBefore(t,f.firstChild);}}}
function buildEx(e,i,l){
  var d=document.createElement("div");d.className="card";
  var types={mcq:"选择",fill:"填空",order:"排列",match:"配对"};
  var t=document.createElement("p");t.innerHTML='<span class="tag">'+(i+1)+'/'+exState.total+' · '+(types[e.t]||"练习")+'</span> '+esc(e.q||"找出正确的法语和中文配对：");d.appendChild(t);
  var solved=false,failedOnce=false;
  function show(ok,msg){
    var old=d.querySelector(".fbk");if(old)old.remove();
    d.appendChild(fbEl(ok,msg));
    if(ok&&!solved){solved=true;markDone();}
    if(!ok&&!failedOnce){failedOnce=true;logErr((l?l.th:"")+": "+(e.q||"配对"));}
  }
  if(e.t==="mcq"){
    shuffle(e.o.slice()).forEach(function(o){
      var b=document.createElement("button");b.className="qopt";b.textContent=o;
      b.onclick=function(){if(solved)return;var ok=e.o[e.a]===o;
        d.querySelectorAll(".qopt").forEach(function(x){x.classList.remove("correct","wrong");});
        b.classList.add(ok?"correct":"wrong");show(ok,ok?(e.exp||"很好！"):"还不是这个答案，再试一次。");};d.appendChild(b);
    });
  }else if(e.t==="fill"){
    var inp=document.createElement("input");inp.className="txt";inp.setAttribute("aria-label","请填写法语答案");inp.autocomplete="off";d.appendChild(inp);
    var b=document.createElement("button");b.className="btn";b.style.marginTop="10px";b.textContent="检查";
    b.onclick=function(){if(solved)return;var ok=norm(inp.value)===norm(e.a);show(ok,ok?(e.exp||"很好！"):"再试一次。提示："+(e.exp||"请仔细看上面的词语。"));};
    inp.addEventListener("keydown",function(ev){if(ev.key==="Enter")b.click();});d.appendChild(b);
  }else if(e.t==="order"){
    var selected=[],parts=e.w.map(function(v,j){return{word:v,id:j};}),mixed=shuffle(parts);
    var slot=document.createElement("div");slot.className="slotline";d.appendChild(slot);
    var pool=document.createElement("div");d.appendChild(pool);
    function draw(){slot.innerHTML="";pool.innerHTML="";
      selected.forEach(function(p,j){var b=document.createElement("button");b.className="chip";b.textContent=p.word;b.title="点这里撤销这个词";b.onclick=function(){if(solved)return;selected.splice(j,1);draw();};slot.appendChild(b);});
      mixed.filter(function(p){return !selected.some(function(x){return x.id===p.id;});}).forEach(function(p){var b=document.createElement("button");b.className="chip";b.textContent=p.word;b.onclick=function(){if(solved)return;selected.push(p);draw();};pool.appendChild(b);});
      if(!selected.length)slot.textContent="按顺序点击下面的法语词";
    }
    draw();
    var b=document.createElement("button");b.className="btn";b.textContent="检查";
    b.onclick=function(){if(solved)return;var ok=norm(selected.map(function(x){return x.word;}).join(" "))===norm(e.a);show(ok,ok?(e.exp||"非常好！"):"词语顺序还不对，可以点上面的词撤销后再试。")};d.appendChild(b);
  }else if(e.t==="match"){
    var words=e.pairs.map(function(p,j){return{fr:p[0],zh:p[1],id:j};});
    var left=document.createElement("div"),right=document.createElement("div"),grid=document.createElement("div");grid.className="pairgrid";grid.appendChild(left);grid.appendChild(right);d.appendChild(grid);
    var selected=-1,matched=[];
    words.forEach(function(p){var b=document.createElement("button");b.className="chip";b.textContent=p.fr;b.setAttribute("data-fri",p.id);b.onclick=function(){if(solved||matched.includes(p.id))return;selected=p.id;refresh();};left.appendChild(b);});
    shuffle(words).forEach(function(p){var b=document.createElement("button");b.className="chip";b.textContent=p.zh;b.setAttribute("data-zhi",p.id);b.onclick=function(){if(solved||matched.includes(p.id)||selected<0)return;
      if(selected===p.id){matched.push(p.id);selected=-1;refresh();if(matched.length===words.length)show(true,"全部配对正确！");}
      else{selected=-1;refresh();show(false,"还不对，请重新选择一组词语。");}
    };right.appendChild(b);});
    function refresh(){d.querySelectorAll("[data-fri]").forEach(function(b){var id=Number(b.dataset.fri);b.classList.toggle("selected",id===selected);b.classList.toggle("matched",matched.includes(id));b.disabled=matched.includes(id);});d.querySelectorAll("[data-zhi]").forEach(function(b){var id=Number(b.dataset.zhi);b.classList.toggle("matched",matched.includes(id));b.disabled=matched.includes(id);});}
  }
  return d;
}
function logErr(t){if(S.err.length>200)S.err.shift();S.err.push({t:t,d:Date.now()});save();}
function saveMyLine(id){
  var ta=document.getElementById("myline");
  if(!ta)return;
  if(!S.mynotes)S.mynotes={};
  S.mynotes[id]=ta.value;
  save();
}
function copyMyLine(btn){
  var ta=document.getElementById("myline");
  if(!ta||!ta.value.trim()){btn.textContent="先写一句吧 :)";setTimeout(function(){btn.textContent="复制";},1500);return;}
  var t=ta.value;
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){btn.textContent="已复制 ✓";setTimeout(function(){btn.textContent="复制";},1500);});}
  else{var ta2=document.createElement("textarea");ta2.value=t;document.body.appendChild(ta2);ta2.select();try{document.execCommand("copy");btn.textContent="已复制 ✓";}catch(e){}document.body.removeChild(ta2);}
}
/* ---------- 词典 ---------- */
function renderDict(){
  var h='<h1>法语小词典</h1><p class="muted">收录 60 课的所有词汇。可以搜法语或中文。点 ⭐ 加入收藏。</p>';
  h+='<input id="dq" class="txt" placeholder="搜：bonjour 或 你好…" oninput="renderDictList()">';
  h+='<div id="dlist"></div>';
  app.innerHTML=h;
  renderDictList();
  setTimeout(function(){document.getElementById("dq").focus();},50);
}
function allWords(){
  var seen={},arr=[];
  ALL.forEach(function(l){l.words.forEach(function(w){
    var k=w[0]+"|"+w[1];
    if(!seen[k]){seen[k]=1;arr.push({fr:w[0],cn:w[1],py:w[2],wk:l.w});}
  });});
  return arr;
}
function renderDictList(){
  var q=(document.getElementById("dq").value||"").toLowerCase();
  var ws=allWords().filter(function(w){return !q||w.fr.toLowerCase().indexOf(q)>=0||w.cn.indexOf(q)>=0;});
  document.getElementById("dlist").innerHTML=ws.length?ws.map(function(w){
    var fav=S.fav.indexOf(w.fr)>=0;
    return '<div class="card dictrow"><div class="grow"><div class="wfr" style="font-size:1.4rem">'+esc(w.fr)+'</div><div class="whz" style="font-size:1.2rem">'+esc(w.cn)+' <span class="wpy">（'+esc(w.py)+'）</span></div><span class="tag">第'+w.w+'周</span>'+elixButton(w.fr)+'</div><button class="star" aria-label="收藏" onclick="toggleFav(\''+w.fr.replace(/'/g,"\\'")+'\');renderDictList()">'+(fav?"⭐":"☆")+'</button></div>';
  }).join(""):'<p class="muted">没有找到这个词。试试别的写法？</p>';
}
function toggleFav(fr){var i=S.fav.indexOf(fr);if(i<0)S.fav.push(fr);else S.fav.splice(i,1);save();}
/* ---------- 复习 ---------- */
function renderRev(){
  var h='<h1>复习</h1>';
  var ws=allWords().filter(function(w){return S.fav.indexOf(w.fr)>=0;});
  h+='<div class="card"><h3>⭐ 我的收藏（'+ws.length+'）</h3>';
  h+=ws.length?'<div id="revbox"></div><button class="btn" style="margin-top:8px" onclick="startRevQuiz()">开始小测（收藏词）</button>':'<p class="muted">还没有收藏。去「词典」点 ⭐ 收藏生词，这里会变成专属你的小测。</p>';
  h+='</div>';
  h+='<div class="card"><h3>✗ 我错过的地方（'+S.err.length+'）</h3>';
  h+=S.err.length?'<ul>'+S.err.slice(-15).reverse().map(function(e){return '<li>'+esc(e.t)+'</li>';}).join("")+'</ul><button class="btn ghost" onclick="if(confirm(\'清空错误记录？\')){S.err=[];save();renderRev();}">清空记录</button>':'<p class="muted">还没有做错的记录。做错了也不用担心：错题会自动出现在这里。</p></div>';
  app.innerHTML=h;
}
function startRevQuiz(){
  var ws=allWords().filter(function(w){return S.fav.indexOf(w.fr)>=0;});
  if(ws.length<3){alert("至少收藏 3 个词才能开始小测。");return;}
  var picks=shuffle(ws).slice(0,6);
  var exs=picks.map(function(w){
    var others=shuffle(allWords().filter(function(x){return x.fr!==w.fr;})).slice(0,2).map(function(x){return x.cn;});
    return {t:"mcq",q:"«"+w.fr+"» 的意思是：",o:shuffle([w.cn].concat(others)),a:0,exp:w.fr+" = "+w.cn+"。",cn:w.cn};
  });
  exs.forEach(function(e){e.a=e.o.indexOf(e.cn);});
  var box=document.getElementById("revbox");
  var wrap=document.createElement("div");
  exState={done:0,total:exs.length};
  exs.forEach(function(e,i){wrap.appendChild(buildEx(e,i,{th:"复习"}));});
  box.innerHTML="";box.appendChild(wrap);
  var fin=document.createElement("p");fin.className="okline";fin.textContent="做完上面的题就完成一次复习。可以反复测。";
  box.appendChild(fin);
}

  else{var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");btn.textContent="已复制 ✓";}catch(e){}document.body.removeChild(ta);}

/* ---------- 可选的学习进度分享：本人明确点击才发送 ---------- */
function progressStats(){
  var ids=Object.create(null), studied=[], words=Object.create(null), weeks=Object.create(null);
  (S.done||[]).forEach(function(id){ids[id]=true;});
  ALL.forEach(function(l){
    if(!ids[l.w+"-"+l.d])return;
    studied.push(l);
    weeks[l.w]=(weeks[l.w]||0)+1;
    l.words.forEach(function(w){words[w[0].trim().toLowerCase()]=true;});
  });
  var notes=Object.keys(S.mynotes||{}).filter(function(id){return (S.mynotes[id]||"").trim().length>0;}).length;
  return {done:studied.length,words:Object.keys(words).length,notes:notes,weeks:weeks,
    last:studied.length?studied[studied.length-1]:null};
}
function progressText(){
  var p=progressStats();
  var lines=["📚 清的法语小课堂 · 我的学习进度", "Le français avec Qing", "",
    "✅ 已完成课程："+p.done+" / "+ALL.length,
    "📖 已接触词汇："+p.words+" 个（来自已完成课程）",
    "✍️ 已写学习句子："+p.notes+" 条"];
  var wkeys=Object.keys(p.weeks).map(Number).sort(function(a,b){return a-b;});
  if(wkeys.length){lines.push("", "🗓 每周完成情况：");wkeys.forEach(function(w){lines.push("第 "+w+" 周："+p.weeks[w]+" / 5 节");});}
  if(p.last)lines.push("", "最近完成：第 "+p.last.w+" 周 · 第 "+p.last.d+" 课 · "+p.last.th);
  lines.push("", "🌷 我按照自己的节奏慢慢学习。", "https://francais-avec-qing.onrender.com/");
  return lines.join("\n");
}
function renderProgressShare(){
  var p=progressStats(),pct=Math.round(p.done/ALL.length*100);
  var h='<h1>📈 我的学习进度</h1><p class="muted">这是你的个人学习记录。只有你主动点击分享按钮，别人才会看到。没有成绩，也没有压力。</p>';
  h+='<div class="card"><h3>已经学了这么多！</h3><div class="pbar"><div class="pfill" style="width:'+pct+'%"></div></div>'+
    '<p><b>'+p.done+' / '+ALL.length+'</b> 节小课（'+pct+'%）</p>'+
    '<p>📖 已接触词汇：<b>'+p.words+'</b> 个</p>'+
    '<p>✍️ 已写学习句子：<b>'+p.notes+'</b> 条</p>'+
    '<p class="muted">词汇是已完成课程中出现过的不同法语词语数量，不代表已经全部记住；这里不统计练习成绩。</p></div>';
  h+='<div class="card"><h3>每周的小脚印</h3>';
  WEEKS.forEach(function(w){var n=p.weeks[w.n]||0;h+='<div class="row"><span>第 '+w.n+' 周 · '+esc(w.th)+'</span><b>'+n+' / 5</b></div>';});
  h+='</div><div class="card"><h3>💛 自愿分享给亲爱的人</h3>'+
    '<p>你可以把下面的学习总结通过 WhatsApp 发送给你想分享的人。网站不会自动发送，也不会直接让别人查看你的进度。</p>'+
    '<textarea id="progress-preview" class="txt" readonly style="height:240px;min-height:240px;font-size:.87rem;line-height:1.5">'+esc(progressText())+'</textarea>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn" onclick="sendProgressWhatsApp()">💬 用 WhatsApp 分享</button> '+
    '<button class="btn ghost" onclick="copyProgressText(this)">复制学习进度</button></div>'+
    '<p class="muted">发送前你可以在 WhatsApp 中查看、修改或取消消息。没有任何自动分享。</p></div>';
  app.innerHTML=h;
}
function sendProgressWhatsApp(){
  var url="https://wa.me/?text="+encodeURIComponent(progressText());
  // Ouverture déclenchée par le clic de Qing, destinataire choisi dans WhatsApp.
  var win=window.open(url,"_blank","noopener,noreferrer");
  if(!win)window.location.href=url;
}
function copyProgressText(btn){
  var t=progressText();
  function ok(){btn.textContent="已复制 ✓";setTimeout(function(){btn.textContent="复制学习进度";},1800);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok).catch(function(){fallbackCopyProgress(t,btn);});}
  else fallbackCopyProgress(t,btn);
}
function fallbackCopyProgress(t,btn){
  var ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.left="-9999px";
  document.body.appendChild(ta);ta.select();try{if(document.execCommand("copy"))btn.textContent="已复制 ✓";else btn.textContent="请手动复制上方文字";}catch(e){btn.textContent="请手动复制上方文字";}document.body.removeChild(ta);
}
